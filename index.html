<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otome Diary · 乙女游戏档案</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>
    <div class="background-orb orb-3"></div>

    <main class="app-shell">
      <section class="hero glass-card">
        <div class="hero-copy-block">
          <p class="eyebrow">Otome Diary</p>
          <h1>乙女游戏收藏档案</h1>
          <p class="hero-copy">
            用简洁的方式整理玩过的作品、角色路线与个人感想，留出一个安静、清楚的私人游戏库。
          </p>
          <div class="hero-actions">
            <button class="primary-button" id="heroAddGame">新增游戏</button>
            <button class="secondary-button" id="jumpToLibrary">查看游戏库</button>
          </div>
        </div>
        <div class="hero-note glass-inner">
          <p class="eyebrow">About</p>
          <h2>只保留真正需要的内容</h2>
          <p>
            首页用于浏览收藏列表；点进单个游戏后，再查看评分、感想与角色路线。没有内容时，也会保持清爽的空白状态。
          </p>
        </div>
      </section>

      <section id="librarySection" class="library-shell">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Library</p>
            <h2>游戏库</h2>
            <p class="section-copy">从这里开始整理你的收藏。</p>
          </div>
          <button class="primary-button" id="addGameButton">新增游戏</button>
        </div>

        <section id="libraryView" class="view-panel glass-card">
          <div id="gamesContainer" class="games-grid"></div>
        </section>

        <section id="detailView" class="view-panel glass-card hidden"></section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
